name: Build Android APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APKs with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Pro APK
        uses: actions/upload-artifact@v3
        with:
          name: Flix-Casa-Pro-APK
          path: android/app/build/outputs/apk/pro/release/*.apk

      - name: Upload Standard APK
        uses: actions/upload-artifact@v3
        with:
          name: Flix-Casa-Standard-APK
          path: android/app/build/outputs/apk/standard/release/*.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v3
        with:
          name: Flix-Casa-TV-APK
          path: android/app/build/outputs/apk/tv/release/*.apk