name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js Web Assets
        env:
          NEXT_DISABLE_ESLINT: true
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -e
          [ ! -d src/app/api ] || mv src/app/api src/app-api-build-backup
          [ ! -d app/api ] || mv app/api app-api-build-backup
          restore_routes() {
            [ ! -d src/app-api-build-backup ] || mv src/app-api-build-backup src/app/api
            [ ! -d app-api-build-backup ] || mv app-api-build-backup app/api
          }
          trap restore_routes EXIT
          npm run build

      - name: Verify Static Web Assets
        run: test -f out/index.html

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlixCasa-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
